slug: ci-runners
display_name: CI Runners
description: Managed CI/CD runner stack for GitHub Actions and GitLab workloads.
component_name: oci://ghcr.io/kubesage/charts/ci-runners
default_version: 0.1.0
components:
  - GitHub Actions runners
  - GitLab runners
  - Test parallelization
namespace: ci-runners
category: developer-platform
icon: rocket
docs_url: https://docs.paasible.com/stacks/ci-runners

defaults:
  runner:
    maxCount: 2
    resources:
      requests: { cpu: "500m", memory: "512Mi" }
      limits: { cpu: "1", memory: "1Gi" }

overridable_values:
  - key: runner.maxCount
    type: integer
    description: "Maximum number of concurrent CI runners"
    min: 1
    max: 20
  - key: runner.resources.requests.memory
    type: string
    description: "Runner memory request"
    allowed_values: ["512Mi", "1Gi", "2Gi", "4Gi"]
