slug: ci-runners
display_name: CI Runners
description: Managed CI/CD runner stack for GitHub Actions and GitLab workloads.
component_name: oci://ghcr.io/kubesage/charts/ci-runners
default_version: 0.1.0
compatible_tiers:
  - starter
  - pro
  - enterprise
components:
  - GitHub Actions runners
  - GitLab runners
  - Test parallelization
namespace: ci-runners
category: developer-platform
icon: rocket
docs_url: https://docs.paas.ro/stacks/ci-runners

tier_presets:
  starter:
    runner:
      maxCount: 2
      resources:
        requests: { cpu: "500m", memory: "512Mi" }
        limits: { cpu: "1", memory: "1Gi" }
  pro:
    runner:
      maxCount: 5
      resources:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "2", memory: "4Gi" }
  enterprise:
    runner:
      maxCount: 10
      resources:
        requests: { cpu: "2", memory: "4Gi" }
        limits: { cpu: "4", memory: "8Gi" }

overridable_values:
  - key: runner.maxCount
    type: integer
    description: "Maximum number of concurrent CI runners"
    min: 1
    max: 20
  - key: runner.resources.requests.memory
    type: string
    description: "Runner memory request"
    allowed_values: ["512Mi", "1Gi", "2Gi", "4Gi"]
