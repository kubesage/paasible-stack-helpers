slug: observability
display_name: Observability
description: Managed observability stack with metrics, logs, dashboards, and alerting.
component_name: oci://ghcr.io/kubesage/charts/observability
default_version: 0.1.0
compatible_tiers:
  - free
  - starter
  - pro
  - enterprise
components:
  - Prometheus
  - Grafana
  - Loki
  - Alertmanager
namespace: observability
category: operations
icon: activity
docs_url: https://docs.paas.ro/stacks/observability

tier_presets:
  free:
    prometheus:
      resources:
        requests: { cpu: "100m", memory: "256Mi" }
        limits: { cpu: "500m", memory: "512Mi" }
      retention: "24h"
    grafana:
      replicas: 1
    loki:
      resources:
        requests: { cpu: "100m", memory: "128Mi" }
  starter:
    prometheus:
      resources:
        requests: { cpu: "250m", memory: "512Mi" }
        limits: { cpu: "1", memory: "1Gi" }
      retention: "7d"
    grafana:
      replicas: 1
    loki:
      resources:
        requests: { cpu: "250m", memory: "256Mi" }
  pro:
    prometheus:
      resources:
        requests: { cpu: "500m", memory: "1Gi" }
        limits: { cpu: "2", memory: "4Gi" }
      retention: "30d"
    grafana:
      replicas: 2
    loki:
      resources:
        requests: { cpu: "500m", memory: "512Mi" }
  enterprise:
    prometheus:
      resources:
        requests: { cpu: "1", memory: "2Gi" }
        limits: { cpu: "4", memory: "8Gi" }
      retention: "90d"
    grafana:
      replicas: 3
    loki:
      resources:
        requests: { cpu: "1", memory: "1Gi" }

overridable_values:
  - key: prometheus.retention
    type: string
    description: "Prometheus data retention period"
    allowed_values: ["24h", "3d", "7d", "14d", "30d"]
  - key: grafana.replicas
    type: integer
    description: "Number of Grafana replicas"
    min: 1
    max: 3
  - key: loki.resources.requests.memory
    type: string
    description: "Loki memory request"
    allowed_values: ["128Mi", "256Mi", "512Mi", "1Gi"]
