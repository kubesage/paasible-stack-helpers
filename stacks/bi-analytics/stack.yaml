slug: bi-analytics
display_name: BI & Analytics
description: Managed BI and analytics platform with ETL orchestration and dashboards.
component_name: oci://ghcr.io/kubesage/charts/bi-analytics
default_version: 0.1.0
components:
  - Airflow
  - Superset
  - Data lake connectors
namespace: analytics
category: data
icon: chart-bar
docs_url: https://docs.paasible.com/stacks/bi-analytics

defaults:
  airflow:
    workers:
      replicas: 1
      resources:
        requests: { cpu: "250m", memory: "512Mi" }
        limits: { cpu: "1", memory: "2Gi" }
  superset:
    replicas: 1
  datalake:
    enabled: false

overridable_values:
  - key: airflow.workers.replicas
    type: integer
    description: "Number of Airflow worker replicas"
    min: 1
    max: 8
  - key: superset.replicas
    type: integer
    description: "Number of Superset replicas"
    min: 1
    max: 4
  - key: airflow.workers.resources.requests.memory
    type: string
    description: "Airflow worker memory request"
    allowed_values: ["512Mi", "1Gi", "2Gi", "4Gi"]
