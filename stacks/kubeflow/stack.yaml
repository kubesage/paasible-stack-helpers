slug: kubeflow
display_name: Kubeflow
description: Managed MLOps platform with pipelines, notebooks, and service mesh support.
component_name: oci://ghcr.io/kubesage/charts/kubeflow
default_version: 0.1.0
components:
  - Kubeflow
  - Istio
  - Knative
namespace: kubeflow
category: ai-ml
icon: brain
docs_url: https://docs.paasible.com/stacks/kubeflow

defaults:
  notebook:
    resources:
      requests: { cpu: "500m", memory: "2Gi" }
      limits: { cpu: "2", memory: "4Gi" }
  katib:
    enabled: true
  pipelines:
    parallelism: 2
  gpu:
    enabled: false

overridable_values:
  - key: notebook.resources.requests.memory
    type: string
    description: "Notebook server memory request"
    allowed_values: ["2Gi", "4Gi", "8Gi", "16Gi"]
  - key: pipelines.parallelism
    type: integer
    description: "Maximum parallel pipeline runs"
    min: 1
    max: 16
